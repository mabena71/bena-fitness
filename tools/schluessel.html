<!doctype html>
<html lang="de">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="robots" content="noindex">
  <title>Schlüssel erzeugen</title>
  <style>
    :root { --bg: #f4f5f7; --card: #fff; --text: #16202a; --muted: #637081; --primary: #0f766e; }
    body { font-family: system-ui, sans-serif; background: var(--bg); color: var(--text); margin: 0; padding: 24px 16px; }
    main { max-width: 720px; margin: 0 auto; }
    .card { background: var(--card); border-radius: 14px; padding: 16px; margin-bottom: 14px; box-shadow: 0 1px 3px rgba(0,0,0,.08); }
    label { display: block; font-weight: 700; font-size: .9rem; margin: 12px 0 4px; }
    textarea { width: 100%; box-sizing: border-box; font-family: ui-monospace, monospace; font-size: .85rem; padding: 8px; border-radius: 8px; border: 1px solid #dde2e8; min-height: 48px; }
    button { background: var(--primary); color: #fff; border: 0; border-radius: 10px; padding: 12px 16px; font-weight: 700; font-size: 1rem; cursor: pointer; }
    .muted { color: var(--muted); font-size: .9rem; }
  </style>
</head>
<body>
<main>
  <h1>Schlüssel für Benachrichtigungen</h1>
  <div class="card">
    <p>Diese Seite erzeugt die Schlüssel <b>nur in deinem Browser</b>. Nichts wird gesendet oder gespeichert.</p>
    <button id="go">Schlüssel erzeugen</button>
  </div>
  <div class="card" id="out" hidden>
    <label>VAPID_PUBLIC_KEY (öffentlich: an Claude schicken und als Secret eintragen)</label>
    <textarea id="pub" readonly></textarea>
    <label>VAPID_PRIVATE_KEY (geheim: nur als Secret in Supabase eintragen, niemandem schicken)</label>
    <textarea id="priv" readonly></textarea>
    <label>CRON_SECRET (geheim: als Secret in Supabase und im Zeitplan-SQL eintragen)</label>
    <textarea id="cron" readonly></textarea>
    <p class="muted">Lade die Seite neu, um neue Schlüssel zu erzeugen. Wenn du die Werte eingetragen hast, kannst du die Seite schliessen.</p>
  </div>
</main>
<script>
  const b64url = buf => btoa(String.fromCharCode(...new Uint8Array(buf))).replace(/\+/g, '-').replace(/\//g, '_').replace(/=+$/, '');
  document.getElementById('go').onclick = async () => {
    const pair = await crypto.subtle.generateKey({ name: 'ECDSA', namedCurve: 'P-256' }, true, ['sign', 'verify']);
    const pub = await crypto.subtle.exportKey('raw', pair.publicKey);
    const jwk = await crypto.subtle.exportKey('jwk', pair.privateKey);
    document.getElementById('pub').value = b64url(pub);
    document.getElementById('priv').value = jwk.d;
    document.getElementById('cron').value = b64url(crypto.getRandomValues(new Uint8Array(24)));
    document.getElementById('out').hidden = false;
  };
</script>
</body>
</html>
